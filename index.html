<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manhunt Live</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* --- BLUE AESTHETIC THEME --- */
    :root {
      --bg: #060b16;
      --surface: #0f1a2e;
      --surface-light: #182947;
      --border: #253d68;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --accent: #60a5fa;
      --text: #f0f6fc;
      --text-muted: #94a3b8;
      --danger: #f43f5e;
      --warning: #fbbf24;
      --success: #34d399;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      overflow-y: auto;
      padding: 12px;
    }
    .screen.active { display: flex; }

    h1, h2, h3 { margin: 0 0 8px 0; text-align: center; color: var(--primary); }
    label { font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-top: 8px; }

    input, select, button {
      width: 100%;
      padding: 10px 12px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      background-color: var(--bg);
      color: var(--text);
    }
    input:focus, select:focus {
      outline: 2px solid var(--primary);
    }

    button {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #030914;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); opacity: 0.9; }
    button.secondary {
      background: var(--surface-light);
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    button.danger {
      background: var(--danger);
      color: #fff;
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    #setupMap {
      width: 100%;
      height: 170px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 6px;
    }

    /* --- STRICT 50/50 SPLIT GAME SCREEN --- */
    #screen-game {
      padding: 0;
      overflow: hidden;
    }

    /* TOP HALF: 50% MAP */
    .map-half {
      height: 50dvh;
      width: 100%;
      position: relative;
      border-bottom: 2px solid var(--primary);
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .recenter-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 1000;
      width: auto;
      padding: 6px 10px;
      font-size: 12px;
      background: var(--surface);
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* BOTTOM HALF: 50% FEATURES & CONTROLS */
    .features-half {
      height: 50dvh;
      width: 100%;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      background: var(--bg);
    }

    .hud-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .alert-banner {
      display: none;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .alert-warning { background: var(--warning); color: #000; }
    .alert-danger { background: var(--danger); color: #fff; }

    .feature-buttons {
      display: flex;
      gap: 6px;
    }
    .feature-buttons button {
      margin: 0;
      padding: 8px;
      font-size: 13px;
    }

    .quick-pings {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .quick-pings button {
      width: auto;
      white-space: nowrap;
      margin: 0;
      padding: 5px 8px;
      font-size: 11px;
      background: var(--surface-light);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      min-height: 90px;
    }
    #chatMessages {
      flex: 1;
      overflow-y: auto;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .chat-line { margin-bottom: 3px; }
    .chat-line b { color: var(--primary); }

    .chat-input-bar {
      display: flex;
      gap: 6px;
    }
    .chat-input-bar input { margin: 0; padding: 6px 8px; font-size: 12px; }
    .chat-input-bar button { margin: 0; width: 65px; padding: 6px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- ==========================================
       1. HOME SCREEN (ALL FEATURES UPFRONT)
       ========================================== -->
  <div id="screen-home" class="screen active">
    <h1>⚡ Manhunt Live</h1>

    <!-- Player & Room Info -->
    <div class="card">
      <div class="grid-2">
        <div>
          <label>Your Name</label>
          <input type="text" id="playerName" placeholder="e.g. Vivek" />
        </div>
        <div>
          <label>Room Code</label>
          <input type="text" id="roomCode" placeholder="e.g. 1234" />
        </div>
      </div>

      <label>Your Starting Role</label>
      <select id="initialRole">
        <option value="Hider">🏃 Hider (Run & Hide)</option>
        <option value="Catcher">🕵️ Catcher (Hunt & Radar)</option>
      </select>
    </div>

    <!-- All Game Features Setup directly on Home Screen -->
    <div class="card">
      <h3>⚙️ Game Features & Setup (Host)</h3>
      <div class="grid-2">
        <div>
          <label>Game Timer (Mins)</label>
          <input type="number" id="gameDuration" value="30" min="5" max="180" />
        </div>
        <div>
          <label>GPS Update Speed</label>
          <select id="pingIntervalSelect">
            <option value="0">🔴 Live (Always On)</option>
            <option value="60000">⏱️ Every 1 Min</option>
            <option value="300000" selected>⏱️ Every 5 Mins</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Head-Start (Blind Catchers)</label>
          <select id="headStartSelect">
            <option value="0">Off (0 Mins)</option>
            <option value="60000">1 Minute</option>
            <option value="180000" selected>3 Minutes</option>
            <option value="300000">5 Minutes</option>
          </select>
        </div>
        <div>
          <label>Play-Area Boundary</label>
          <select id="boundarySelect" onchange="updateSetupCircle()">
            <option value="0">No Boundary</option>
            <option value="100">100m Circle</option>
            <option value="250" selected>250m Circle</option>
            <option value="500">500m Circle</option>
            <option value="1000">1km Circle</option>
          </select>
        </div>
      </div>

      <label>Tap Map to Set Play-Area Boundary Center (Defaults to your GPS):</label>
      <div id="setupMap"></div>

      <button onclick="createRoom()">🚀 Create Room with These Settings</button>
      <button class="secondary" onclick="joinRoom()">🔗 Join / Rejoin Existing Room</button>
      <div id="homeError" style="color: var(--danger); text-align: center; font-size: 13px; font-weight: bold; margin-top: 6px;"></div>
    </div>
  </div>

  <!-- ==========================================
       2. LOBBY SCREEN
       ========================================== -->
  <div id="screen-lobby" class="screen">
    <h2>Lobby: Room <span id="displayRoomCode"></span></h2>
    <div class="card">
      <h3>Players Joined</h3>
      <div id="playersList"></div>
    </div>
    <div class="card" id="lobbySummary" style="font-size: 13px; color: var(--text-muted);"></div>
    <button id="startBtn" onclick="startGame()" style="display: none;">🔥 Launch Match Now</button>
    <button class="secondary" onclick="leaveLobby()">Leave Lobby</button>
  </div>

  <!-- ==========================================
       3. GAME SCREEN (50% MAP / 50% FEATURES)
       ========================================== -->
  <div id="screen-game" class="screen">
    <!-- TOP 50%: MAP -->
    <div class="map-half">
      <div id="map"></div>
      <button class="recenter-btn" onclick="recenterMap()">🎯 Center GPS</button>
    </div>

    <!-- BOTTOM 50%: FEATURES DASHBOARD -->
    <div class="features-half">
      <!-- HUD Status -->
      <div class="hud-bar">
        <span id="roleBadge">🏃 Hider</span>
        <span id="timeRemaining">⏳ 00:00</span>
        <span id="nextUpdate">📡 Live</span>
      </div>

      <!-- Dynamic Alert Banners -->
      <div id="headStartBanner" class="alert-banner alert-warning"></div>
      <div id="outOfBoundsBanner" class="alert-banner alert-danger">🚨 OUT OF BOUNDS! Return to circle or your LIVE location is exposed!</div>
      <div id="proximityBanner" class="alert-banner alert-danger">📳 PROXIMITY ALERT: Catcher within 50m!</div>

      <!-- Role Feature Buttons -->
      <div class="feature-buttons">
        <button id="radarBtn" class="secondary" onclick="triggerRadarScan()" style="display:none;">📡 Radar Scan (Force Ping)</button>
        <button id="caughtBtn" class="danger" onclick="markSelfCaught()" style="display:none;">🏳️ I'm Caught</button>
        <button id="hostEndBtn" class="danger" onclick="endGame('🛑 Host ended the match.')" style="display:none;">🛑 End Game</button>
      </div>

      <!-- Quick-Chat Pings -->
      <div class="quick-pings">
        <button onclick="sendQuickPing('🆘 Need backup here!')">🆘 Need backup!</button>
        <button onclick="sendQuickPing('👀 Spotted a Hider!')">👀 Spotted Hider!</button>
        <button onclick="sendQuickPing('📍 Converge on my pin!')">📍 Converge on me!</button>
        <button onclick="sendQuickPing('🏃 Moving North!')">🏃 Moving North!</button>
      </div>

      <!-- Live Room Chat -->
      <div class="chat-container">
        <div id="chatMessages"></div>
        <div class="chat-input-bar">
          <input type="text" id="chatInput" placeholder="Send message..." />
          <button onclick="sendCustomChat()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       4. END SCREEN (AUTO-CLEARS FIREBASE)
       ========================================== -->
  <div id="screen-end" class="screen">
    <h1>🏆 Game Over</h1>
    <div class="card" style="text-align: center;">
      <h2 id="winnerText">Match Ended</h2>
      <p style="color: var(--success); font-size: 13px;">✅ Room & GPS data wiped from Firebase.</p>
      <button onclick="clearAndRestart()">Back to Home Screen</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase & Core Game Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // =========================================================
    // --- PASTE YOUR FIREBASE CONFIG HERE ---
    // =========================================================
    const firebaseConfig = {
  apiKey: "AIzaSyCrorYSjzN5rooWa4keUkPvSGNQt0tZ1sE",
  authDomain: "manhunt-1.firebaseapp.com",
  projectId: "manhunt-1",
  storageBucket: "manhunt-1.firebasestorage.app",
  messagingSenderId: "444030203067",
  appId: "1:444030203067:web:6bed8c6ebff8662d53e59e"
};

    if (!firebaseConfig.databaseURL && firebaseConfig.projectId) {
      firebaseConfig.databaseURL = `https://${firebaseConfig.projectId}-default-rtdb.firebaseio.com`;
    }

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- STATE VARIABLES ---
    let myName = "";
    let myRoom = "";
    let myRole = "Hider";
    let myStatus = "Active";
    let isHost = false;
    let myLat = null;
    let myLng = null;

    // Setup Map (Home Screen Boundary Picker)
    let setupMap = null;
    let setupCircle = null;
    let chosenCenter = { lat: 18.5204, lng: 73.8567 };

    // Game Map & Timers
    let map = null;
    let markers = {};
    let boundaryCircle = null;
    let locationTimer = null;
    let watchId = null;
    let outOfBoundsWatchId = null;
    let countdownTimer = null;

    // Synced Match Settings
    let updateIntervalMs = 300000;
    let nextPingTime = 0;
    let gameEndTime = 0;
    let headStartEndTime = 0;
    let boundaryData = null;
    let lastRadarHandled = 0;
    let lastVibrateTime = 0;
    let gameActive = false;

    const HIGH_PRECISION_GPS = { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 };

    // --- 1. INITIALIZE HOME MAP & AUTO-REJOIN MEMORY ---
    window.addEventListener('DOMContentLoaded', async () => {
      initSetupMap();

      const savedName = localStorage.getItem('manhunt_name');
      const savedRoom = localStorage.getItem('manhunt_room');
      if (savedName) document.getElementById('playerName').value = savedName;
      if (savedRoom) document.getElementById('roomCode').value = savedRoom;

      // Auto-Rejoin if player closed tab during an active game
      if (savedName && savedRoom) {
        try {
          const roomSnap = await get(ref(db, `rooms/${savedRoom}`));
          if (roomSnap.exists()) {
            const roomVal = roomSnap.val();
            if (roomVal.players && roomVal.players[savedName]) {
              myName = savedName;
              myRoom = savedRoom;
              isHost = (roomVal.host === myName);
              myRole = roomVal.players[myName].role;
              myStatus = roomVal.players[myName].status || "Active";
              if (roomVal.status === 'playing') {
                initGame();
              } else if (roomVal.status === 'lobby') {
                enterLobby();
              }
            }
          }
        } catch (e) { console.warn("Rejoin check skipped:", e); }
      }
    });

    function initSetupMap() {
      setupMap = L.map('setupMap').setView([chosenCenter.lat, chosenCenter.lng], 15);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(setupMap);
      updateSetupCircle();

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          chosenCenter = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          setupMap.setView([chosenCenter.lat, chosenCenter.lng], 16);
          updateSetupCircle();
        }, () => {}, HIGH_PRECISION_GPS);
      }

      setupMap.on('click', (e) => {
        chosenCenter = { lat: e.latlng.lat, lng: e.latlng.lng };
        updateSetupCircle();
      });
    }

    window.updateSetupCircle = () => {
      if (!setupMap) return;
      const radius = parseInt(document.getElementById('boundarySelect').value) || 0;
      if (setupCircle) setupMap.removeLayer(setupCircle);
      if (radius > 0) {
        setupCircle = L.circle([chosenCenter.lat, chosenCenter.lng], {
          color: '#38bdf8', fillColor: '#38bdf8', fillOpacity: 0.2, radius: radius
        }).addTo(setupMap);
      }
    };

    function switchScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showError(msg) {
      document.getElementById('homeError').innerText = msg;
    }

    function saveSession() {
      localStorage.setItem('manhunt_name', myName);
      localStorage.setItem('manhunt_room', myRoom);
    }

    // --- 2. CREATE OR JOIN ROOM ---
    window.createRoom = async () => {
      myName = document.getElementById('playerName').value.trim();
      myRoom = document.getElementById('roomCode').value.trim();
      myRole = document.getElementById('initialRole').value;
      if (!myName || !myRoom) return showError("Please enter both your Name and a Room Code.");

      const durationMins = parseInt(document.getElementById('gameDuration').value) || 30;
      const pingMs = parseInt(document.getElementById('pingIntervalSelect').value);
      const headStartMs = parseInt(document.getElementById('headStartSelect').value);
      const boundaryRadius = parseInt(document.getElementById('boundarySelect').value);

      isHost = true;
      saveSession();

      const roomConfig = {
        status: 'lobby',
        host: myName,
        durationMins: durationMins,
        pingInterval: pingMs,
        headStartMs: headStartMs,
        boundary: boundaryRadius > 0 ? { lat: chosenCenter.lat, lng: chosenCenter.lng, radius: boundaryRadius } : null
      };

      await set(ref(db, `rooms/${myRoom}`), roomConfig);
      await set(ref(db, `rooms/${myRoom}/players/${myName}`), { role: myRole, status: 'Active' });
      enterLobby();
    };

    window.joinRoom = async () => {
      myName = document.getElementById('playerName').value.trim();
      myRoom = document.getElementById('roomCode').value.trim();
      myRole = document.getElementById('initialRole').value;
      if (!myName || !myRoom) return showError("Please enter both your Name and a Room Code.");

      const roomSnap = await get(ref(db, `rooms/${myRoom}`));
      if (!roomSnap.exists()) return showError("Room not found! Create it first.");

      const roomVal = roomSnap.val();
      isHost = (roomVal.host === myName);
      saveSession();

      // Rejoin support if already playing
      if (roomVal.status === 'playing') {
        if (roomVal.players && roomVal.players[myName]) {
          myRole = roomVal.players[myName].role;
          myStatus = roomVal.players[myName].status || 'Active';
          initGame();
          return;
        }
        return showError("Game already started!");
      }

      await set(ref(db, `rooms/${myRoom}/players/${myName}`), { role: myRole, status: 'Active' });
      enterLobby();
    };

    // --- 3. LOBBY LOGIC ---
    function enterLobby() {
      switchScreen('screen-lobby');
      document.getElementById('displayRoomCode').innerText = myRoom;
      document.getElementById('startBtn').style.display = isHost ? 'block' : 'none';

      onValue(ref(db, `rooms/${myRoom}`), (snap) => {
        if (!snap.exists()) return;
        const val = snap.val();

        // Display Summary
        const speedText = val.pingInterval === 0 ? "Live GPS" : `Every ${val.pingInterval / 60000} Min`;
        const hsText = `${(val.headStartMs || 0) / 60000} Min`;
        const bText = val.boundary ? `${val.boundary.radius}m Circle` : "None";
        document.getElementById('lobbySummary').innerHTML =
          `<b>Settings:</b> ${val.durationMins}m Match | ${speedText} | Head-Start: ${hsText} | Boundary: ${bText}`;

        // Players List
        const players = val.players || {};
        const list = document.getElementById('playersList');
        list.innerHTML = '';
        for (const [pName, pData] of Object.entries(players)) {
          if (pName === myName) myRole = pData.role;
          const row = document.createElement('div');
          row.className = 'player-row';
          row.innerHTML = `
            <span><b>${pName}</b> ${pName === val.host ? '👑' : ''}</span>
            <select onchange="window.changeRole('${pName}', this.value)" style="width:auto; padding:4px 8px; margin:0;" ${(isHost || pName === myName) ? '' : 'disabled'}>
              <option value="Hider" ${pData.role === 'Hider' ? 'selected' : ''}>🏃 Hider</option>
              <option value="Catcher" ${pData.role === 'Catcher' ? 'selected' : ''}>🕵️ Catcher</option>
            </select>
          `;
          list.appendChild(row);
        }

        if (val.status === 'playing' && !gameActive) initGame();
      });
    }

    window.changeRole = (pName, role) => {
      update(ref(db, `rooms/${myRoom}/players/${pName}`), { role });
    };

    window.leaveLobby = () => {
      localStorage.removeItem('manhunt_room');
      location.reload();
    };

    window.startGame = async () => {
      const snap = await get(ref(db, `rooms/${myRoom}`));
      const val = snap.val();
      const now = Date.now();
      await update(ref(db, `rooms/${myRoom}`), {
        status: 'playing',
        endTime: now + (val.durationMins * 60000),
        headStartEndTime: now + (val.headStartMs || 0),
        radarSweep: 0
      });
    };

    // --- 4. GAME ENGINE & 50/50 SPLIT UI ---
    async function initGame() {
      if (gameActive) return;
      gameActive = true;
      switchScreen('screen-game');

      const snap = await get(ref(db, `rooms/${myRoom}`));
      const val = snap.val();
      gameEndTime = val.endTime;
      updateIntervalMs = val.pingInterval ?? 300000;
      headStartEndTime = val.headStartEndTime ?? 0;
      boundaryData = val.boundary || null;

      // Setup Role Buttons
      document.getElementById('roleBadge').innerText = `${myRole === 'Catcher' ? '🕵️' : '🏃'} ${myRole}`;
      document.getElementById('radarBtn').style.display = (myRole === 'Catcher') ? 'block' : 'none';
      document.getElementById('caughtBtn').style.display = (myRole === 'Hider' && myStatus !== 'Caught') ? 'block' : 'none';
      document.getElementById('hostEndBtn').style.display = isHost ? 'block' : 'none';

      // Init 50% Top Map
      map = L.map('map').setView([chosenCenter.lat, chosenCenter.lng], 16);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

      if (boundaryData) {
        boundaryCircle = L.circle([boundaryData.lat, boundaryData.lng], {
          color: '#38bdf8', fillColor: '#38bdf8', fillOpacity: 0.12, radius: boundaryData.radius
        }).addTo(map);
      }
      setTimeout(() => map.invalidateSize(), 300);

      startGPS();
      countdownTimer = setInterval(updateHUD, 1000);

      // Listen for Players & Proximity
      onValue(ref(db, `rooms/${myRoom}/players`), (pSnap) => {
        const players = pSnap.val() || {};
        if (players[myName]) myStatus = players[myName].status;
        renderPlayersAndAlerts(players);
        checkWin(players);
      });

      // Listen for Catcher's Radar Scan
      onValue(ref(db, `rooms/${myRoom}/radarSweep`), (rSnap) => {
        const sweep = rSnap.val() || 0;
        if (sweep > lastRadarHandled && (Date.now() - sweep < 15000)) {
          lastRadarHandled = sweep;
          if (myRole === 'Hider' && myStatus !== 'Caught') {
            forceHighPrecisionPing(true);
          }
        }
      });

      // Listen for Chat & Quick Pings
      onValue(ref(db, `rooms/${myRoom}/chat`), (cSnap) => {
        const chats = cSnap.val() || {};
        const box = document.getElementById('chatMessages');
        box.innerHTML = '';
        for (const msg of Object.values(chats)) {
          const d = document.createElement('div');
          d.className = 'chat-line';
          d.innerHTML = `<b>${msg.sender}:</b> ${msg.text}`;
          box.appendChild(d);
        }
        box.scrollTop = box.scrollHeight;
      });

      // Listen for Game End & Wipe Firebase
      onValue(ref(db, `rooms/${myRoom}/status`), async (sSnap) => {
        if (sSnap.val() === 'ended') {
          const resSnap = await get(ref(db, `rooms/${myRoom}/result`));
          finishAndCleanUp(resSnap.val() || "Match Ended!");
        }
      });
    }

    // --- 5. HIGH-PRECISION GPS & BOUNDARY EXPOSURE ---
    function startGPS() {
      if (!navigator.geolocation) return;

      if (updateIntervalMs === 0) {
        document.getElementById('nextUpdate').innerText = "📡 Live GPS";
        watchId = navigator.geolocation.watchPosition(
          (pos) => handlePosition(pos, false),
          (err) => console.warn(err),
          HIGH_PRECISION_GPS
        );
      } else {
        forceHighPrecisionPing(false);
        locationTimer = setInterval(() => forceHighPrecisionPing(false), updateIntervalMs);
      }
    }

    function forceHighPrecisionPing(isRadar) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          handlePosition(pos, isRadar);
          if (!isRadar) nextPingTime = Date.now() + updateIntervalMs;
        },
        (err) => console.warn(err),
        HIGH_PRECISION_GPS
      );
    }

    function handlePosition(pos, isRadar) {
      myLat = pos.coords.latitude;
      myLng = pos.coords.longitude;
      let outOfBounds = false;

      if (boundaryData && myRole === 'Hider' && myStatus !== 'Caught') {
        const dist = calcMeters(myLat, myLng, boundaryData.lat, boundaryData.lng);
        outOfBounds = dist > boundaryData.radius;
        document.getElementById('outOfBoundsBanner').style.display = outOfBounds ? 'block' : 'none';

        // If Hider steps outside boundary on a timed mode, force continuous Live exposure until back inside
        if (outOfBounds && updateIntervalMs > 0 && outOfBoundsWatchId === null) {
          outOfBoundsWatchId = navigator.geolocation.watchPosition(
            (p) => handlePosition(p, true),
            () => {},
            HIGH_PRECISION_GPS
          );
        } else if (!outOfBounds && outOfBoundsWatchId !== null) {
          navigator.geolocation.clearWatch(outOfBoundsWatchId);
          outOfBoundsWatchId = null;
        }
      }

      update(ref(db, `rooms/${myRoom}/players/${myName}`), {
        lat: myLat,
        lng: myLng,
        outOfBounds: outOfBounds,
        lastUpdated: Date.now()
      });
    }

    window.recenterMap = () => {
      if (map && myLat && myLng) map.setView([myLat, myLng], 17);
    };

    // --- 6. MAP PINS, HEAD-START BLINDNESS & 50M VIBRATION ---
    let centeredOnce = false;
    function renderPlayersAndAlerts(players) {
      if (!map) return;
      const now = Date.now();
      const inHeadStart = now < headStartEndTime;
      const me = players[myName];
      let dangerClose = false;

      for (const [name, p] of Object.entries(players)) {
        if (!p.lat || !p.lng) continue;

        // 50m Proximity Check between active Hider & Catcher
        if (me && me.lat && name !== myName && myStatus !== 'Caught' && p.status !== 'Caught' && myRole !== p.role) {
          const d = calcMeters(me.lat, me.lng, p.lat, p.lng);
          if (d <= 50) dangerClose = true;
        }

        // Head-Start Timer Rule: Catchers see a blank map (no Hiders) unless Hider broke boundary
        if (myRole === 'Catcher' && p.role === 'Hider' && inHeadStart && !p.outOfBounds) {
          if (markers[name]) { map.removeLayer(markers[name]); delete markers[name]; }
          continue;
        }

        const color = p.status === 'Caught' ? '#64748b' : (p.outOfBounds ? '#fbbf24' : (p.role === 'Catcher' ? '#f43f5e' : '#38bdf8'));
        const iconHtml = `<div style="background:${color};width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 8px ${color};"></div>`;
        const icon = L.divIcon({ html: iconHtml, className: '' });

        if (!markers[name]) {
          markers[name] = L.marker([p.lat, p.lng], { icon }).addTo(map);
        } else {
          markers[name].setLatLng([p.lat, p.lng]);
          markers[name].setIcon(icon);
        }

        let pop = `<b>${name}</b> (${p.role})`;
        if (p.outOfBounds) pop += `<br><b style="color:#d97706;">🚨 OUT OF BOUNDS (LIVE)</b>`;
        if (myRole === 'Catcher' && p.role === 'Hider' && p.status !== 'Caught') {
          pop += `<br><button style="margin-top:4px;padding:4px;background:#f43f5e;color:#fff;" onclick="window.catchHider('${name}')">Mark Caught</button>`;
        }
        markers[name].bindPopup(pop);
      }

      // Trigger 50m Proximity Vibration
      const proxBanner = document.getElementById('proximityBanner');
      if (dangerClose) {
        proxBanner.style.display = 'block';
        if (now - lastVibrateTime > 8000 && navigator.vibrate) {
          navigator.vibrate([300, 120, 300]);
          lastVibrateTime = now;
        }
      } else {
        proxBanner.style.display = 'none';
      }

      if (!centeredOnce && me && me.lat) {
        map.setView([me.lat, me.lng], 17);
        centeredOnce = true;
      }
    }

    function updateHUD() {
      const now = Date.now();
      const left = Math.max(0, Math.floor((gameEndTime - now) / 1000));
      const m = String(Math.floor(left / 60)).padStart(2, '0');
      const s = String(left % 60).padStart(2, '0');
      document.getElementById('timeRemaining').innerText = `⏳ ${m}:${s}`;

      if (left === 0 && isHost) endGame("🏃 Hiders Win! Time ran out.");

      const hsBanner = document.getElementById('headStartBanner');
      if (now < headStartEndTime) {
        const hsSecs = Math.ceil((headStartEndTime - now) / 1000);
        hsBanner.style.display = 'block';
        hsBanner.innerText = `🙈 HEAD-START: Hiders invisible to Catchers for ${hsSecs}s!`;
      } else {
        hsBanner.style.display = 'none';
      }

      if (updateIntervalMs > 0) {
        const pLeft = Math.max(0, Math.floor((nextPingTime - now) / 1000));
        const pm = String(Math.floor(pLeft / 60)).padStart(2, '0');
        const ps = String(pLeft % 60).padStart(2, '0');
        document.getElementById('nextUpdate').innerText = `📡 ${pm}:${ps}`;
      }
    }

    // --- 7. RADAR SCAN, CHAT & CLEAR FIREBASE ON GAME END ---
    window.triggerRadarScan = () => {
      update(ref(db, `rooms/${myRoom}`), { radarSweep: Date.now() });
      sendQuickPing("📡 RADAR SCAN ACTIVATED! Forcing instant Hider GPS update!");
      const btn = document.getElementById('radarBtn');
      btn.disabled = true;
      btn.innerText = "📡 Radar Recharge (60s)";
      setTimeout(() => {
        btn.disabled = false;
        btn.innerText = "📡 Radar Scan (Force Ping)";
      }, 60000);
    };

    window.markSelfCaught = () => {
      update(ref(db, `rooms/${myRoom}/players/${myName}`), { status: 'Caught', outOfBounds: false });
      document.getElementById('caughtBtn').style.display = 'none';
      sendQuickPing("🏳️ I got caught!");
    };

    window.catchHider = (target) => {
      update(ref(db, `rooms/${myRoom}/players/${target}`), { status: 'Caught', outOfBounds: false });
      sendQuickPing(`🎯 Caught ${target}!`);
    };

    window.sendQuickPing = (text) => {
      push(ref(db, `rooms/${myRoom}/chat`), { sender: myName, text });
    };

    window.sendCustomChat = () => {
      const inp = document.getElementById('chatInput');
      const text = inp.value.trim();
      if (!text) return;
      push(ref(db, `rooms/${myRoom}/chat`), { sender: myName, text });
      inp.value = '';
    };

    function checkWin(players) {
      let totalHiders = 0;
      let activeHiders = 0;
      for (const p of Object.values(players)) {
        if (p.role === 'Hider') {
          totalHiders++;
          if (p.status !== 'Caught') activeHiders++;
        }
      }
      if (totalHiders > 0 && activeHiders === 0 && isHost) {
        endGame("🕵️ Catchers Win! All Hiders caught.");
      }
    }

    window.endGame = async (resultMessage) => {
      await update(ref(db, `rooms/${myRoom}`), { status: 'ended', result: resultMessage });
    };

    async function finishAndCleanUp(winnerMsg) {
      if (locationTimer) clearInterval(locationTimer);
      if (countdownTimer) clearInterval(countdownTimer);
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (outOfBoundsWatchId !== null) navigator.geolocation.clearWatch(outOfBoundsWatchId);

      document.getElementById('winnerText').innerText = winnerMsg;
      switchScreen('screen-end');
      localStorage.removeItem('manhunt_room');

      // Clear all room, player GPS, and chat data from Firebase once game ends
      setTimeout(() => {
        remove(ref(db, `rooms/${myRoom}`));
      }, 2000);
    }

    window.clearAndRestart = () => {
      localStorage.removeItem('manhunt_room');
      location.reload();
    };

    function calcMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const rad = x => x * Math.PI / 180;
      const dLat = rad(lat2 - lat1);
      const dLon = rad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
  </script>
</body>
</html>
